[platformio]
; Default Upload (->) button flashes prebuilt binaries with ZERO compilation!
; To compile from source locally, select `esp32dev` (Core v2) or `esp32dev_core3` (Core v3).
default_envs = esp32dev_flash
src_dir = firmware/src
lib_dir = lib
include_dir = include
test_dir = test
workspace_dir = .pio

; ============================================================================
; ZERO-COMPILE PREBUILT FLASH ENVIRONMENTS (1-click Upload after git pull)
; ============================================================================
[env:esp32dev_flash]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
upload_protocol = custom
upload_speed = 460800
monitor_speed = 115200
lib_ldf_mode = off
build_src_filter = -<*>
custom_prebuilt_dir = firmware/prebuilt/esp32dev
extra_scripts =
    pre:scripts/pio_prebuilt_upload.py
    post:scripts/pio_prebuilt_post.py

[env:esp32dev_core3_flash]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
upload_protocol = custom
upload_speed = 460800
monitor_speed = 115200
lib_ldf_mode = off
build_src_filter = -<*>
custom_prebuilt_dir = firmware/prebuilt/esp32dev_core3
extra_scripts =
    pre:scripts/pio_prebuilt_upload.py
    post:scripts/pio_prebuilt_post.py

; ============================================================================
; FULL SOURCE BUILD ENVIRONMENTS (Auto-export to firmware/prebuilt/<env>/)
; ============================================================================
[common_esp32]
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
extra_scripts =
    pre:scripts/pio_esp32_includes.py
    post:scripts/pio_export_prebuilt.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D SOC_WIFI_SUPPORTED=1
    ; Uncomment the following line to completely DISABLE all project logs (for production speed)
    ;-D LOG_LEVEL=999
    -I include
    -I include/Core
    -I include/Core/Async
    -I include/Core/Error
    -I include/Network
    -I include/Network/WiFi
    -I include/Network/HTTP
    -I include/Timer
    -I include/Utilities
    -I include/Events
    -I include/Optimization
    -I include/AsyncTCP
    -I include/AsyncMqttClient
    -I include/ArduinoWebsockets
    -I include/ESP_NOW
monitor_speed = 115200
lib_ldf_mode = deep+

; Arduino-ESP32 Core v2.x build environment (uses framework WiFi & WiFiClientSecure)
[env:esp32dev]
extends = common_esp32
platform = espressif32@^6.10.0
lib_deps =
    heman/AsyncMqttClient-esphome@^2.1.0
    esphome/AsyncTCP-esphome@^2.0.0
    WiFi
    WiFiClientSecure
    HTTPClient
    DNSServer
    ESPmDNS
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^6.21.3
lib_ignore = ESPAsyncTCP, AsyncTCP-esphome, AsyncMqttClient, AsyncMqttClient-esphome, ArduinoWebsockets, ESP_NOW

; Arduino-ESP32 Core v3.x build environment (LEDC Core v3 API + custom optimized WiFi/NetworkCore/NetworkClientSecure)
[env:esp32dev_core3]
extends = common_esp32
platform = espressif32@8.0.0
build_flags =
    ${common_esp32.build_flags}
    -I include/WiFi
    -I include/NetworkCore
    -I include/NetworkClientSecure
lib_deps =
    heman/AsyncMqttClient-esphome@^2.1.0
    esp32async/AsyncTCP@^3.6.1
    WiFi
    Networking
    NetworkClientSecure
    HTTPClient
    DNSServer
    ESPmDNS
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^6.21.3
lib_ignore = ESPAsyncTCP, AsyncTCP-esphome, AsyncMqttClient, AsyncMqttClient-esphome, ArduinoWebsockets, WiFi, Networking, Network, NetworkClientSecure, ESP_NOW

; Native host unit test environments (GpioPwm Core v2 & Core v3 + Protocol + PinManager + RuleEngine + NVS + MQTT + WS)
[common_native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<Optimization/>
lib_ldf_mode = deep+
build_flags =
    -std=gnu++14
    -D UNIUNO_NATIVE_TEST
    -D UNIUNO_TEST_ESP32_LEDC
    -D UNIUNO_TEST_ESP32_ADC
    -I include
    -I include/Core
    -I include/Core/Async
    -I include/Core/Error
    -I include/Timer
    -I include/Utilities
    -I include/Events
    -I include/Optimization
    -I test/mocks
    -I src/Optimization
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
lib_ignore =
    AchaemenidNetwork
    AsyncMqttClient-esphome
    AsyncTCP-esphome
    AsyncTCP
    ESPAsyncTCP
    WiFi
    WiFiClientSecure
    Networking
    NetworkClientSecure
    HTTPClient
    WebServer
    DNSServer
    ESPmDNS
    Ticker
    Preferences
    ArduinoWebsockets

[env:native]
extends = common_native

[env:native_core3]
extends = common_native
build_flags =
    ${common_native.build_flags}
    -D UNIUNO_TEST_ESP32_CORE_V3
