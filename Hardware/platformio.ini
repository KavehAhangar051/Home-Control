[platformio]
default_envs = esp32dev
src_dir = firmware/src
lib_dir = lib
include_dir = include
test_dir = test
workspace_dir = .pio

[common_esp32]
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/pio_esp32_includes.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D SOC_WIFI_SUPPORTED=1
    ; Uncomment the following line to completely DISABLE all project logs (for production speed)
    ;-D LOG_LEVEL=999
    -I include
    -I include/Core
    -I include/Core/Async
    -I include/Core/Error
    -I include/Network
    -I include/Network/WiFi
    -I include/Network/HTTP
    -I include/Timer
    -I include/Utilities
    -I include/Events
    -I include/Optimization
monitor_speed = 115200
lib_ldf_mode = deep+

; Default environment: Arduino-ESP32 Core v2.x (compatible with AsyncTCP-esphome & WiFiClientSecure)
[env:esp32dev]
extends = common_esp32
platform = espressif32@^6.10.0
lib_deps =
    heman/AsyncMqttClient-esphome@^2.1.0
    esphome/AsyncTCP-esphome@^2.0.0
    WiFi
    WiFiClientSecure
    HTTPClient
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^6.21.3
lib_ignore = ESPAsyncTCP

; Arduino-ESP32 Core v3.x environment (LEDC Core v3 API + NetworkClientSecure)
[env:esp32dev_core3]
extends = common_esp32
platform = espressif32@8.0.0
lib_deps =
    heman/AsyncMqttClient-esphome@^2.1.0
    esp32async/AsyncTCP@^3.6.1
    WiFi
    Networking
    NetworkClientSecure
    HTTPClient
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^6.21.3
lib_ignore = ESPAsyncTCP, AsyncTCP-esphome

; Native host unit test environments (GpioPwm Core v2 & Core v3 + Protocol + PinManager + RuleEngine + NVS + MQTT + WS)
[common_native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<Optimization/>
lib_ldf_mode = deep+
build_flags =
    -std=gnu++14
    -D UNIUNO_NATIVE_TEST
    -D UNIUNO_TEST_ESP32_LEDC
    -I include
    -I include/Core
    -I include/Core/Async
    -I include/Core/Error
    -I include/Timer
    -I include/Utilities
    -I include/Events
    -I include/Optimization
    -I test/mocks
    -I src/Optimization
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
lib_ignore =
    AchaemenidNetwork
    AsyncMqttClient-esphome
    AsyncTCP-esphome
    AsyncTCP
    ESPAsyncTCP
    WiFi
    WiFiClientSecure
    Networking
    NetworkClientSecure
    HTTPClient
    WebServer
    Ticker
    Preferences
    ArduinoWebsockets

[env:native]
extends = common_native

[env:native_core3]
extends = common_native
build_flags =
    ${common_native.build_flags}
    -D UNIUNO_TEST_ESP32_CORE_V3
