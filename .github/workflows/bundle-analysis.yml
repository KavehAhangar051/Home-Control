name: Bundle analysis

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "package.json"
      - "bun.lock"
      - "next.config.ts"
      - "docs/performance/**"
      - ".github/workflows/bundle-analysis.yml"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot name (for example: before or after)"
        required: false
        default: before

permissions:
  contents: read

concurrency:
  group: bundle-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BUNDLE_SNAPSHOT: ${{ inputs.snapshot || (contains(github.event.head_commit.message || '', '[bundle-after]') && 'after') || 'before' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Capture named Turbopack bundle snapshot
        run: bun run analyze --snapshot "$BUNDLE_SNAPSHOT"

      - name: Export bundle graph as JSONL
        run: bun run analyze:export --snapshot "$BUNDLE_SNAPSHOT" > "bundle-$BUNDLE_SNAPSHOT.jsonl"

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bundle-analysis-${{ env.BUNDLE_SNAPSHOT }}-${{ github.sha }}
          path: |
            bundle-*.jsonl
            .next/diagnostics/analyze/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
