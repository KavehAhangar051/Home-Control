name: Regenerate Bun lockfile for Next.js 16

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - ".github/workflows/regenerate-next16-lock.yml"

permissions:
  contents: write

concurrency:
  group: regenerate-next16-lock
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile
        run: bun install
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/regenerate-next16-lock.yml
          git commit -m "Regenerate Bun lockfile for Next.js 16"
          git push
      - name: Verify frozen installation
        run: bun install --frozen-lockfile
      - name: Verify lint and types
        run: bun run lint && bun run typecheck
