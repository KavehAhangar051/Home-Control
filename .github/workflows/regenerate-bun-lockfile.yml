name: Regenerate Bun lockfile

on:
  push:
    branches: ["chore/dependency-audit-cleanup"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/dependency-audit-cleanup
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Run Knip dependency audit
        run: bunx --bun knip --cache --no-exit-code
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): regenerate Bun lockfile"
            git push
          else
            echo "bun.lock is already synchronized"
          fi
