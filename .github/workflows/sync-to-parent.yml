name: Notify Home-Control parent

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-home-control-parent
  cancel-in-progress: false

jobs:
  request-parent-sync:
    if: (github.event_name != 'push' || github.event.head_commit.committer.email != '41898282+github-actions[bot]@users.noreply.github.com') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_commit.committer.email != '41898282+github-actions[bot]@users.noreply.github.com'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch parent synchronization
        env:
          PARENT_SYNC_TOKEN: ${{ secrets.PARENT_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PARENT_SYNC_TOKEN:-}" ]]; then
            echo "::error::PARENT_SYNC_TOKEN is not configured. Add this secret to enable immediate parent synchronization."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/KavehAhangar051/Home-Control/actions/workflows/sync-modules.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PARENT_SYNC_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'

          echo "Parent repository synchronization has been requested."
