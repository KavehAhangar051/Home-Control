name: Verify restored Oxlint configuration

on:
  push:
    branches: ["chore/restore-anti-slop-plugin"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Lint (Biome + Oxlint)
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
