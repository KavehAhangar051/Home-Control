name: Sync Home-Control modules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-modules.yml"
      - "Hardware/**"
      - "Database/**"
      - "Dashboard/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-control-module-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || github.event.head_commit.committer.email != '41898282+github-actions[bot]@users.noreply.github.com')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from the latest parent main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Reconcile child histories into their parent folders
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CHILD_REPOS_TOKEN:-}" ]]; then
            echo "::error::Create CHILD_REPOS_TOKEN with Contents: Read and write access to Home-Control-Hardwar-Codes, Home-Control-DB, and Home-Control-Dashboard."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          parent_auth_header="$(git config --local --get http.https://github.com/.extraheader || true)"
          git config --local --unset-all http.https://github.com/.extraheader || true
          child_auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"

          reconcile_subtree() {
            local prefix="$1"
            local repository="$2"
            local child_url="https://github.com/${repository}.git"
            local pull_output
            local pull_status

            echo "Reconciling ${repository} into ${prefix}/"

            if ! git cat-file -e "HEAD:${prefix}" 2>/dev/null; then
              echo "Importing ${repository} as a subtree."
              git -c "http.extraheader=AUTHORIZATION: basic ${child_auth_header}" \
                subtree add --prefix="$prefix" "$child_url" main \
                -m "chore: import ${prefix} from ${repository}"
              return
            fi

            if pull_output="$(git -c "http.extraheader=AUTHORIZATION: basic ${child_auth_header}" \
              subtree pull --prefix="$prefix" "$child_url" main \
              -m "chore: reconcile ${prefix} with ${repository}" 2>&1)"; then
              printf '%s\\n' "$pull_output"
              return
            else
              pull_status=$?
              printf '%s\\n' "$pull_output"
            fi

            if [[ "$pull_output" == *"fatal: refusing to merge unrelated histories"* ]]; then
              echo "Reconnecting unrelated histories for ${prefix}; child repository is authoritative."
              git merge --abort >/dev/null 2>&1 || true
              git reset --hard HEAD
              git rm -r --force -- "$prefix"
              git commit -m "chore: remove ${prefix} before subtree history recovery"
              git -c "http.extraheader=AUTHORIZATION: basic ${child_auth_header}" \
                subtree add --prefix="$prefix" "$child_url" main \
                -m "chore: reconnect ${prefix} history from ${repository}"
              return
            fi

            if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
              echo "Merge conflict in ${prefix}; resolving only conflicting paths in favor of child."
              while IFS= read -r -d '' conflicted_path; do
                if git cat-file -e "MERGE_HEAD:${conflicted_path}" 2>/dev/null; then
                  git checkout --theirs -- "$conflicted_path"
                  git add -- "$conflicted_path"
                else
                  git rm -f -- "$conflicted_path"
                fi
              done < <(git diff --name-only --diff-filter=U -z)

              if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                echo "::error::Could not resolve every conflict in ${prefix}."
                git merge --abort || true
                return 1
              fi

              git commit -m "chore: resolve ${prefix} conflicts in favor of child"
              return
            fi

            echo "::error::Subtree pull failed for ${prefix}; refusing to overwrite files automatically."
            return "$pull_status"
          }

          reconcile_subtree "Hardware" "KavehAhangar051/Home-Control-Hardwar-Codes"
          reconcile_subtree "Database" "KavehAhangar051/Home-Control-DB"
          reconcile_subtree "Dashboard" "KavehAhangar051/Home-Control-Dashboard"

          if [[ -n "$parent_auth_header" ]]; then
            git config --local http.https://github.com/.extraheader "$parent_auth_header"
          fi

          # Retry if a normal parent commit lands while this sync is running.
          # Merge the newest parent main so unrelated concurrent changes are preserved.
          for attempt in 1 2 3; do
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              if git merge --no-edit origin/main; then
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                echo "::error::Could not merge the latest parent main; refusing to overwrite concurrent changes."
                exit 1
              fi
            fi
            echo "Parent main changed during push (attempt ${attempt}); retrying."
          done
          echo "::error::Could not push after three attempts."
          exit 1

      - name: Push Hardware subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Hardware -b sync-hardware
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KavehAhangar051/Home-Control-Hardwar-Codes.git" sync-hardware:main

      - name: Push Database subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Database -b sync-database
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KavehAhangar051/Home-Control-DB.git" sync-database:main

      - name: Push Dashboard subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Dashboard -b sync-dashboard
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KavehAhangar051/Home-Control-Dashboard.git" sync-dashboard:main
