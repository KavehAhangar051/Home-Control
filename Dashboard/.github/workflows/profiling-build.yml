name: Profiling build (source maps)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profiling-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build source-mapped static dashboard
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Verify quality gates
        run: bun run lint && bun run typecheck

      - name: Build source-mapped static export
        run: bun run build
        env:
          ENABLE_PROFILING_SOURCEMAPS: "true"

      - name: Verify source maps exist
        run: |
          count="$(find out -type f -name '*.map' | wc -l)"
          echo "Generated source maps: $count"
          test "$count" -gt 0

      - name: Upload profiling site (not deployed)
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-profiling-${{ github.sha }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
