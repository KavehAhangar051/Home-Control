name: Refresh Bun lockfile

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-bun-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - name: Regenerate lockfile from package.json
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun lockfile"
          # Rebase the generated lockfile commit onto the latest main without pull.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Regenerate the lockfile in CI and publish the resulting commit.
