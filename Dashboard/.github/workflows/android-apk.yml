name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android CLI
        run: |
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] https://dl.google.com/android/cli/latest/debian/ stable main" | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes android-cli
          android --version
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          android --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-36 build-tools/36.0.0

      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Capacitor Android project
        run: bun run android:prepare

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build static dashboard and debug APK
        env:
          GITHUB_PAGES: "false"
          DISABLE_HMR: "false"
        run: bun run android:apk

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: home-control-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="android-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Android Debug APK ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          NOTES="$(printf 'Automated debug APK build.\n\n- Source commit: `%s`\n- Workflow run: %s (attempt %s)\n- Build type: unsigned debug APK\n\nThis is a development build, not a signed production release.' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA"
