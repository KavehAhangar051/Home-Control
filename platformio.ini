[platformio]
src_dir = Hardware/firmware/src
lib_dir = Hardware/lib
include_dir = Hardware/include
test_dir = Hardware/test
data_dir = Hardware/data
workspace_dir = Hardware/.pio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D SOC_WIFI_SUPPORTED=1
    ; Uncomment the following line to completely DISABLE all project logs (for production speed)
    ;-D LOG_LEVEL=999
    -I Hardware/include
    -I Hardware/include/Core
    -I Hardware/include/Core/Async
    -I Hardware/include/Core/Error
    -I Hardware/include/Network
    -I Hardware/include/Network/WiFi
    -I Hardware/include/Network/HTTP
    -I Hardware/include/Timer
    -I Hardware/include/Utilities
    -I Hardware/include/Events
    -I Hardware/include/Optimization
    -I Hardware/include/AsyncTCP
    -I Hardware/include/AsyncMqttClient
    -I Hardware/include/ArduinoWebsockets
    -I Hardware/include/WiFi
    -I Hardware/include/NetworkCore
    -I Hardware/include/NetworkClientSecure
    -I Hardware/include/ESP_NOW
    -I C:/Users/Kamyar-IoT/.platformio/packages/framework-arduinoespressif32/libraries/Network/src
    -I C:/Users/Kamyar-IoT/.platformio/packages/framework-arduinoespressif32/libraries/WiFi/src
    -I C:/Users/Kamyar-IoT/.platformio/packages/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I C:/Users/Kamyar-IoT/.platformio/packages/framework-arduinoespressif32/libraries/HTTPClient/src
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    heman/AsyncMqttClient-esphome@^2.1.0
    esphome/AsyncTCP-esphome@^2.0.0
    WiFi
    NetworkClientSecure
    HTTPClient
    gilmaimon/ArduinoWebsockets@^0.5.3
    bblanchon/ArduinoJson@^6.21.3
lib_ignore = ESPAsyncTCP, AsyncTCP-esphome, AsyncMqttClient, AsyncMqttClient-esphome, ArduinoWebsockets, WiFi, Networking, Network, NetworkClientSecure, ESP_NOW
upload_port = COM3





